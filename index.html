<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>playstuff</title>
<style>
:root { --bg: #e9f1ee; --panel: #f6faf8; --fg: #1d2b27; --muted: #586c66; --line: #c2d3cc; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121c1a; --panel: #1f302b; --fg: #e6f0ec; --muted: #94a9a2; --line: #30443e; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 540px; margin: 0 auto; }
h1 { font-size: 28px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--fg); text-decoration: none; }
a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
a span { display: block; color: var(--muted); font-size: 13px; }
</style>
</head>
