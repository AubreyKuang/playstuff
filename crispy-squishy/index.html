<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>脆皮捏捏</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one column. The toy on a square stage is the page; the shop (what you own, what you can
   buy, the shelf, the daily stamp) sits in tabs under it. */
:root {
  --bg: #e9f1ee;
  --stage: #cfe0d9;
  --stage-hi: #eef6f2;
  --panel: #f6faf8;
  --fg: #1d2b27;
  --muted: #586c66;
  --line: #c2d3cc;
  --accent: #d6336c;
  --accent-fg: #fff7fa;
  --bean: #f2b01e;
  --bean-edge: #b97a00;
  --good: #1f8a5b;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121c1a; --stage: #17231f; --stage-hi: #2a3f39; --panel: #1f302b; --fg: #e6f0ec; --muted: #94a9a2;
    --line: #30443e; --accent: #ff6b9d; --accent-fg: #2a0a16; --bean: #f6c040; --bean-edge: #8a5c00; --good: #5fd3a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121c1a; --stage: #17231f; --stage-hi: #2a3f39; --panel: #1f302b; --fg: #e6f0ec; --muted: #94a9a2;
  --line: #30443e; --accent: #ff6b9d; --accent-fg: #2a0a16; --bean: #f6c040; --bean-edge: #8a5c00; --good: #5fd3a0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: 0.02em; }
.wallet { display: flex; align-items: center; gap: 8px; }
.purse { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; font-weight: 600; }
.bean { width: 16px; height: 16px; border-radius: 50%; background: var(--bean); box-shadow: inset 0 -2px 0 var(--bean-edge); flex: none; }
.stage-box { position: relative; background: radial-gradient(ellipse 70% 62% at 50% 44%, var(--stage-hi), var(--stage) 78%); border-radius: 28px; overflow: hidden; }
canvas#stage { display: block; width: 100%; aspect-ratio: 1 / 1; max-width: 100%; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas#stage:active { cursor: grabbing; }
.hint { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; pointer-events: none; font-family: var(--display); font-size: 18px; color: var(--muted); }
.tag { position: absolute; left: 14px; top: 12px; pointer-events: none; font-size: 13px; color: var(--muted); }
.tag b { color: var(--fg); font-weight: 600; }
.actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btn { font-family: var(--display); font-size: 16px; padding: 10px 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; min-width: 0; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .card:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn.ready { animation: nudge 0.9s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .btn.ready { animation: none; } }
.meter { display: flex; flex-direction: column; gap: 4px; }
.meter-label { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter-label b { color: var(--fg); font-weight: 600; }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 100%; background: var(--accent); border-radius: 3px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.tab { flex: 1 1 0; min-width: 0; padding: 8px 4px; border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; position: relative; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tab .pip { position: absolute; top: 6px; margin-left: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; min-width: 0; text-align: center; }
.card.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.card.locked { background: none; border-style: dashed; }
.card.poor .cost { color: var(--muted); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); }
.card .name { font-size: 13px; line-height: 1.25; }
.card .sub { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.card .sub .bean { width: 11px; height: 11px; box-shadow: inset 0 -1px 0 var(--bean-edge); }
.card .cost { color: var(--fg); font-weight: 600; }
.panel-note { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 108px; padding: 10px 6px; border-radius: 14px; border: 1px dashed var(--line); text-align: center; font-size: 13px; color: var(--muted); min-width: 0; }
.slot.full { border-style: solid; background: var(--panel); color: var(--fg); }
.slot .btn { font-size: 14px; padding: 6px 10px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.day b { color: var(--fg); font-size: 13px; }
.day.got { background: none; opacity: 0.55; }
.day.next { border-color: var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sound { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
summary { cursor: pointer; font-size: 14px; }
.knobs { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; margin-top: 10px; font-size: 13px; }
.knobs input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
.knobs output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>脆皮捏捏铺</h1>
    <div class="wallet">
      <span class="purse" title="糖豆"><span class="bean"></span><span id="coins">0</span></span>
      <button class="btn" id="signBtn" type="button">签到</button>
    </div>
  </header>

  <div class="stage-box">
    <canvas id="stage" aria-label="工作台上的一颗脆皮捏捏，按住它可以捏爆外壳，挤出内馅"></canvas>
    <div class="tag" id="tag"></div>
    <div class="hint" id="hint">按住它，用力捏爆</div>
  </div>

  <div class="actions">
    <button class="btn" id="dip" type="button">再裹一层</button>
    <button class="btn" id="sell" type="button">上架卖</button>
    <button class="btn primary" id="recoat" type="button">再做一颗</button>
  </div>

  <div class="meter">
    <div class="meter-label"><span>完整脆皮 <b id="left">100%</b></span><span>碎片 <b id="flakes">0</b> · 爆浆 <b id="bursts">0</b> · 捏完 <b id="cleared">0</b> 颗</span></div>
    <div class="track"><div class="fill" id="bar"></div></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" type="button" data-tab="toys" aria-selected="true">款式</button>
    <button class="tab" role="tab" type="button" data-tab="coats" aria-selected="false">脆皮口味</button>
    <button class="tab" role="tab" type="button" data-tab="shelf" aria-selected="false">货架<span class="pip" id="pip-shelf" hidden></span></button>
    <button class="tab" role="tab" type="button" data-tab="sign" aria-selected="false">签到<span class="pip" id="pip-sign" hidden></span></button>
  </div>

  <section id="p-toys">
    <p class="panel-note">点已有的款式就做一颗。没有的可以用糖豆兑换。</p>
    <div class="grid" id="g-toys"></div>
  </section>
  <section id="p-coats" hidden>
    <p class="panel-note">裹在外面的那层硬壳。口味越稀有，上架卖得越贵。</p>
    <div class="grid" id="g-coats"></div>
  </section>
  <section id="p-shelf" hidden>
    <p class="panel-note">没捏过的捏捏可以上架。卖出去比自己捏赚得多，但要等客人来。</p>
    <div class="shelf" id="g-shelf"></div>
  </section>
  <section id="p-sign" hidden>
    <p class="panel-note">每天来领一次糖豆，连续七天奖励递增，断签从第一天重新算。</p>
    <div class="days" id="g-days"></div>
    <button class="btn primary" id="claim" type="button">领取今天的糖豆</button>
  </section>

  <details>
    <summary>调手感</summary>
    <div class="knobs">
      <label for="k-brittle">脆度</label><input type="range" id="k-brittle" min="1" max="10" value="6"><output id="o-brittle">6</output>
      <label for="k-soft">内馅软度</label><input type="range" id="k-soft" min="1" max="10" value="5"><output id="o-soft">5</output>
      <label for="k-rebound">内馅回弹</label><input type="range" id="k-rebound" min="1" max="10" value="1"><output id="o-rebound">1</output>
      <label for="k-ooze">爆浆量</label><input type="range" id="k-ooze" min="1" max="10" value="6"><output id="o-ooze">6</output>
      <label for="k-finger">手指大小</label><input type="range" id="k-finger" min="1" max="10" value="5"><output id="o-finger">5</output>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="sound"><input type="checkbox" id="sound" checked>声音</label>
      <button class="btn" id="reset" type="button" style="font-size:13px;padding:6px 10px">清空存档</button>
    </div>
    <p class="note">内馅回弹 1 是粘土，捏成什么样就留成什么样；调高会越来越像 Q 弹的果冻。布丁和气泡水自带回弹。手机上可以两根手指一起捏。</p>
  </details>
</div>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const shellCv = document.createElement('canvas');
  const sctx = shellCv.getContext('2d');
  const $ = id => document.getElementById(id);
  const hsl = (c, dl = 0, a = 1) => `hsla(${c[0]}, ${c[1]}%, ${Math.max(0, Math.min(100, c[2] + dl))}%, ${a})`;
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- the toys ----------
  // Outlines are drawn in unit coordinates around the toy's centre (y points down). A toy can be
  // several overlapping outlines (a head plus two ears); the silhouette is their union.
  const param = (fn, n = 160) => { const p = []; for (let i = 0; i < n; i++) p.push(fn(i / n * Math.PI * 2)); return p; };
  const oval = (rx, ry, ox = 0, oy = 0) => param(t => [ox + rx * Math.cos(t), oy + ry * Math.sin(t)], 72);
  const rrect = (w, h, r, ox = 0, oy = 0) => {
    const p = [], hw = w / 2, hh = h / 2;
    [[hw - r, hh - r], [-(hw - r), hh - r], [-(hw - r), -(hh - r)], [hw - r, -(hh - r)]].forEach(([x, y], q) => {
      for (let i = 0; i <= 6; i++) { const a = (q + i / 6) * Math.PI / 2; p.push([ox + x + Math.cos(a) * r, oy + y + Math.sin(a) * r]); }
    });
    return p;
  };
  const starPts = (x, y, ro, ri, squash = 1) => { const p = []; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? ri : ro; p.push([x + Math.cos(a) * r, y + Math.sin(a) * r * squash]); } return p; };
  const INK = 'rgba(40,24,30,0.92)';
  const mirror = list => list.concat(list.map(d => ({ ...d, x: d.x === undefined ? undefined : -d.x, rot: d.rot ? -d.rot : d.rot, pts: d.pts ? d.pts.map(([x, y]) => [-x, y]) : undefined })));
  const lemon = (x, y, r) => {
    const d = [{ k: 'dot', x, y, rx: r, ry: r, c: 'hsl(50, 95%, 58%)' }, { k: 'dot', x, y, rx: r * 0.84, ry: r * 0.84, c: 'hsl(54, 95%, 78%)' }];
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI; d.push({ k: 'line', c: 'rgba(255,255,240,0.9)', w: 0.014, pts: [[x - Math.cos(a) * r * 0.8, y - Math.sin(a) * r * 0.8], [x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.8]] }); }
    return d;
  };

  // The hard coat that goes on the outside. "plain" keeps the food's own skin; the others are dipped coatings.
  // g.p(angle, k) gives a point k of the way out to the silhouette, so a pattern fits any shape.
  const COATS = {
    plain: { name: '原味', price: 0, mult: 1 },
    milk: { name: '牛奶', price: 0, mult: 1.1, shell: [42, 45, 95], crack: [30, 25, 58], deco: () => [] },
    choco: { name: '巧克力', price: 80, mult: 1.25, shell: [20, 55, 25], crack: [38, 60, 84],
      deco: g => [0.35, 0.05, -0.3].map(off => ({ k: 'line', c: 'rgba(125,75,40,0.6)', w: 0.03, pts: [-0.75, -0.45, -0.15, 0.15, 0.45, 0.75].map((x, i) => { const q = g.p(0, 1); return [x * q[0], off * g.p(Math.PI / 2, 1)[1] + (i % 2 ? 0.1 : -0.1)]; }) })) },
    matcha: { name: '抹茶牛奶', price: 150, mult: 1.4, shell: [92, 38, 58], crack: [90, 35, 92],
      deco: g => {
        const d = [];
        for (let i = 0; i < 6; i++) { const [x, y] = g.p(rnd(0, 6.283), rnd(0.15, 0.8)); d.push({ k: 'soft', x, y, r: rnd(0.22, 0.4), c: '255,255,244', a: 0.8 }); }
        for (let i = 0; i < 3; i++) { const a = rnd(0, 6.283); d.push({ k: 'line', c: 'rgba(255,255,244,0.65)', w: 0.035, pts: [0.75, 0.4, 0.1, -0.3, -0.7].map((k, j) => g.p(a + j * 0.35, Math.abs(k))) }); }
        return d;
      } },
    caramel: { name: '焦糖', price: 220, mult: 1.6, shell: [28, 88, 40], crack: [45, 65, 93],
      deco: g => { const d = []; for (let i = 0; i < 5; i++) { const [x, y] = g.p(rnd(0, 6.283), rnd(0.2, 0.9)); d.push({ k: 'soft', x, y, r: rnd(0.25, 0.45), c: '105,40,5', a: 0.5 }); } return d; } },
    berrymilk: { name: '草莓牛奶', price: 300, mult: 1.8, shell: [346, 78, 82], crack: [346, 65, 46],
      deco: g => { const d = []; for (let i = 0; i < 18; i++) { const [x, y] = g.p(rnd(0, 6.283), Math.sqrt(Math.random()) * 0.85); d.push({ k: 'dot', x, y, rx: rnd(0.02, 0.04), ry: rnd(0.02, 0.035), rot: rnd(0, 3), c: i % 2 ? 'rgba(210,55,90,0.85)' : 'rgba(255,255,255,0.9)' }); } return d; } },
  };

  // Each food: its own skin (shell), the doughy filling, the runny centre, the crack colour, its outline,
  // what is painted on the shell (the paint breaks away with it), and optionally what sits inside the filling.
  const TOYS = {
    egg: { name: '鸡蛋', price: 0, shell: [32, 50, 88], paste: [50, 45, 95], goo: [43, 100, 52], crack: [28, 35, 48],
      shape: () => [param(t => [0.76 * Math.cos(t) * (1 + 0.17 * Math.sin(t)), Math.sin(t)])],
      deco: () => { const d = []; for (let i = 0; i < 12; i++) { const a = rnd(0, 6.283), r = Math.sqrt(Math.random()) * 0.6; d.push({ k: 'dot', x: Math.cos(a) * r, y: Math.sin(a) * r * 1.2, rx: rnd(0.02, 0.035), ry: 0.018, c: 'rgba(120,80,50,0.3)' }); } return d; } },
    block: { name: '奶砖', price: 0, shell: [44, 55, 93], paste: [48, 80, 88], goo: [45, 60, 97], crack: [35, 35, 55],
      shape: () => [rrect(1.6, 1.5, 0.3)],
      deco: () => [{ k: 'line', c: 'rgba(170,150,110,0.45)', w: 0.018, close: true, pts: rrect(1.28, 1.18, 0.2) }, { k: 'text', x: 0, y: 0.02, size: 0.4, text: 'MILK', c: 'rgba(165,140,100,0.6)' }] },
    berry: { name: '蓝莓', price: 0, shell: [228, 45, 24], paste: [268, 48, 80], goo: [286, 55, 46], crack: [268, 55, 84],
      shape: () => [oval(1, 0.94)],
      deco: () => [{ k: 'dot', x: 0, y: -0.6, rx: 0.2, ry: 0.12, c: 'rgba(8,10,36,0.6)' }, { k: 'line', c: 'rgba(150,165,230,0.75)', w: 0.014, close: true, pts: starPts(0, -0.6, 0.21, 0.1, 0.6) }] },
    toast: { name: '吐司', price: 60, shell: [27, 62, 44], paste: [45, 55, 96], goo: [44, 95, 62], crack: [42, 60, 94],
      shape: () => [rrect(1.56, 1.3, 0.2, 0, 0.14), oval(0.46, 0.36, -0.36, -0.5), oval(0.46, 0.36, 0.36, -0.5)],
      deco: g => [{ k: 'poly', c: 'hsl(40, 78%, 84%)', pts: g.ring(0.83) }, { k: 'soft', x: 0, y: 0.1, r: 0.7, c: '225,160,70', a: 0.25 },
        { k: 'poly', c: 'hsl(48, 96%, 66%)', pts: [[-0.2, -0.02], [0.14, -0.1], [0.24, 0.2], [-0.1, 0.28]] }, { k: 'soft', x: -0.02, y: 0.04, r: 0.12, c: '255,255,255', a: 0.6 }] },
    strawberry: { name: '草莓', price: 90, shell: [352, 80, 50], paste: [345, 85, 88], goo: [350, 85, 44], crack: [345, 90, 90],
      shape: () => [param(t => { const c = Math.cos(t), s = Math.sin(t); return s > 0 ? [0.95 * c * (1 - 0.5 * s * s), 1.08 * s - 0.15] : [0.95 * c, 0.7 * s - 0.15]; })],
      deco: () => {
        const d = [];
        [[-0.38, [-0.55, -0.18, 0.18, 0.55]], [-0.12, [-0.68, -0.34, 0, 0.34, 0.68]], [0.14, [-0.5, -0.17, 0.17, 0.5]], [0.4, [-0.32, 0, 0.32]], [0.64, [-0.14, 0.14]]]
          .forEach(([y, xs]) => xs.forEach(x => d.push({ k: 'dot', x, y, rx: 0.03, ry: 0.048, c: 'rgba(255,226,120,0.95)' })));
        [20, 55, 90, 125, 160].forEach(deg => { const a = deg * Math.PI / 180; d.push({ k: 'dot', x: Math.cos(a) * 0.22, y: -0.86 + Math.sin(a) * 0.22, rx: 0.22, ry: 0.09, rot: a, c: 'hsl(125, 55%, 34%)' }); });
        return d;
      } },
    mochi: { name: '芝麻汤圆', price: 120, shell: [40, 25, 96], paste: [30, 8, 40], goo: [30, 10, 13], crack: [30, 10, 34],
      shape: () => [oval(1, 0.9)],
      deco: () => [{ k: 'soft', x: 0.25, y: 0.3, r: 0.8, c: '200,190,175', a: 0.3 }] },
    popsicle: { name: '脆皮雪糕', price: 160, smooth: 1, shell: [20, 55, 26], paste: [48, 85, 92], goo: [48, 75, 96], crack: [45, 70, 90],

  function at(an) {
    const a = pts[an.t.a], b = pts[an.t.b], c = pts[an.t.c];
    return { x: a.x * an.u + b.x * an.v + c.x * an.w, y: a.y * an.u + b.y * an.v + c.y * an.w };
  }

  // more dipped layers make a thicker shell: harder to break, worth more
  const baseThr = () => (0.40 - 0.032 * P.brittle) * (1 + 0.4 * (cur.layers - 1));
  const edgeThr = e => baseThr() * (0.65 + 0.7 * Math.random()) * (e.seam ? 1 : 2.6);

  function newToy(wobble) {
    const k = wobble ? 0.95 : 1;
    for (const p of pts) {
      p.x = p.px = cx + (p.ox - cx) * k; p.y = p.py = cy + (p.oy - cy) * k;
      p.hx = p.ox; p.hy = p.oy; p.bare = false;
    }
    // The shell is laid out as random plates. Seams between plates give way first, so cracks
    // run as long jagged lines and the shell comes off in chunks; a plate only breaks up
    // inside when it is bent hard, e.g. right under a finger.
    const seeds = [];
    for (let i = 0; i < 48; i++) seeds.push(tris[(Math.random() * tris.length) | 0].rc);
    for (const t of tris) {
      let best = 0, bd = Infinity;
      for (let i = 0; i < seeds.length; i++) {
        const dx = seeds[i].x - t.rc.x, dy = seeds[i].y - t.rc.y, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      t.plate = best; t.shell = true; t.rest = t.rest0; t.sh = undefined; t.lt = undefined;
    }
    cur.layers = 1; cur.touched = false; cur.pieces = 0; cur.price = priceOf(S.toy, S.coat, 1);
    for (const e of edges) {
      e.cracked = false; e.shell = true; e.rest = e.rest0;
      e.seam = e.t.length === 2 && tris[e.t[0]].plate !== tris[e.t[1]].plate;
      e.thr = edgeThr(e);
    }
    shards = []; stuck = []; goo = []; blobs = []; dimples = []; dust = []; pops = [];
    loose = []; compsDirty = false; pressure = 1;
    shellCount = tris.length; doneFlag = false;
    $('recoat').classList.remove('ready');
    updateActions();
  }

  function nearestVertex(x, y) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const dx = pts[i].x - x, dy = pts[i].y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  // ---------- physics ----------
  function physics(now) {
    const jelly = Math.max(look.jelly, (P.rebound - 1) / 9);                    // 0 = clay that keeps its shape, 1 = bouncy jelly
    const creep = (0.03 + 0.012 * P.soft) * (1 - jelly);  // how fast the filling gives up its old shape
    const fingerR = R * (0.16 + 0.028 * P.finger);
    const damp = 0.55 + 0.25 * jelly;
    for (const p of pts) {
      const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy;
      const k = p.bare ? 0.05 * jelly : 0.04;             // exposed clay has no memory of where it was
      p.x += (p.hx - p.x) * k; p.y += (p.hy - p.y) * k;
    }
    const fs = [...fingers.values()];
    for (const f of fs) {
      f.r = fingerR * (1 - Math.exp(-Math.max(0, now - f.t0) / 140));   // the press sinks in over ~0.15s
      if (now - f.mark > 280 && f.r > fingerR * 0.7) {                  // leave thumbprints in bare clay
        f.mark = now;
        const v = nearestVertex(f.x, f.y);
        if (pts[v].bare) {
          dimples.push({ v, ox: f.x - pts[v].x, oy: f.y - pts[v].y, r: f.r * 0.8, life: 1 });
          if (dimples.length > 26) dimples.shift();
        }
      }
    }
    const holdShape = shellCount > tris.length * 0.6;

    for (let it = 0; it < 6; it++) {
      for (const e of edges) {
        const a = pts[e.a], b = pts[e.b];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        const k = (!e.cracked && e.shell) ? 0.9 : 0.45;   // an intact shell makes the toy rigid until it gives
        const m = (d - e.rest) / d * 0.5 * k;
        dx *= m; dy *= m;
        a.x += dx; a.y += dy; b.x -= dx; b.y -= dy;
      }
      // the filling cannot be compressed: squeezed in one place, it has to come out somewhere else
      for (const t of tris) {
        if (t.shell) continue;
        const a = pts[t.a], b = pts[t.b], c = pts[t.c];
        const C = area(a, b, c) - t.rest;
        const gax = b.y - c.y, gay = c.x - b.x, gbx = c.y - a.y, gby = a.x - c.x, gcx = a.y - b.y, gcy = b.x - a.x;
        const sum = gax * gax + gay * gay + gbx * gbx + gby * gby + gcx * gcx + gcy * gcy;
        if (sum < 1e-6) continue;
        const s = 0.5 * C / sum;
        a.x -= s * gax; a.y -= s * gay; b.x -= s * gbx; b.y -= s * gby; c.x -= s * gcx; c.y -= s * gcy;
      }
      // the other hand holds the toy: it can be squashed, but not slide away
      let mx = 0, my = 0;
      for (const p of pts) { mx += p.x; my += p.y; }
      mx = (mx / pts.length - c0.x) * 0.9; my = (my / pts.length - c0.y) * 0.9;
      for (const p of pts) { p.x -= mx; p.y -= my; }
      if (holdShape) {                                    // ...nor spin, while the shell is mostly whole
        let sc = 0, sd = 0;
        for (const p of pts) {
          const hx = p.hx - cx, hy = p.hy - cy, qx = p.x - cx, qy = p.y - cy;
          sc += hx * qy - hy * qx; sd += hx * qx + hy * qy;
        }
        const ang = -0.9 * Math.atan2(sc, sd), ca = Math.cos(ang), sa = Math.sin(ang);
        for (const p of pts) {
          const qx = p.x - cx, qy = p.y - cy;
          p.x = cx + qx * ca - qy * sa; p.y = cy + qx * sa + qy * ca;
        }
      }
      for (const f of fs) {
        const r2 = f.r * f.r;
        for (const p of pts) {
          let dx = p.x - f.x, dy = p.y - f.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < r2) {
            let d = Math.sqrt(d2);
            if (d < 0.01) { dx = 0.01; dy = 0; d = 0.01; }
            const s = (f.r - d) / d * (p.bare ? 0.55 : 1);   // a finger sinks into clay, but is stopped by shell
            p.x += dx * s; p.y += dy * s;
          }
        }
      }
    }

    // plastic flow: stretched or squashed filling forgets its old shape, so dents and bulges stay
    if (creep > 0) for (const e of edges) {
      if (!e.cracked && e.shell) continue;
      const a = pts[e.a], b = pts[e.b];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      e.rest += (d - e.rest) * creep;
      e.rest = Math.max(e.rest0 * 0.45, Math.min(e.rest0 * 2.4, e.rest));
    }

    // runny filling slides down and drips off
    for (const g of goo) {
      g.vx *= 0.9; g.vy = g.vy * 0.92 + 0.11; g.x += g.vx; g.y += g.vy;
      for (const f of fs) {
        const dx = g.x - f.x, dy = g.y - f.y, d = Math.hypot(dx, dy) || 1;
        if (d < f.r) { g.x += dx / d * (f.r - d) * 0.6; g.y += dy / d * (f.r - d) * 0.6; }
      }
    }
    goo = goo.filter(g => g.y < H + 30);
    // shell crumbs that stayed stuck to the clay get worked loose
    for (let i = stuck.length - 1; i >= 0; i--) {
      const s = stuck[i], q = pts[s.v];
      for (const f of fs) if (Math.hypot(q.x - f.x, q.y - f.y) < f.r * 1.3 && Math.random() < 0.02) {
        shards.push({ x: q.x, y: q.y, p: s.p, o: s.o, tone: s.tone, vx: (Math.random() - 0.5) * 3, vy: -1.5 - Math.random(), rot: 0, vr: (Math.random() - 0.5) * 0.3, life: 1 });
        stuck.splice(i, 1); break;
      }
    }
    for (const d of dimples) d.life -= 0.004;
    dimples = dimples.filter(d => d.life > 0);
  }

  function fracture() {
    if (coat < 1) return;              // a fresh shell is still setting: the wobble must not crack it
    let cracks = 0, flakes = 0;
    const fs = [...fingers.values()];
    // fatigue: shell that keeps getting worked weakens, so holding or kneading always makes progress
    // (without this a loose slab of shell just slides aside on the filling instead of breaking)
    for (const f of fs) {
      const r2 = f.r * f.r * 2.56;
      for (const e of edges) {
        if (e.cracked || !e.shell) continue;
        const a = pts[e.a], dx = a.x - f.x, dy = a.y - f.y;
        if (dx * dx + dy * dy < r2) e.thr *= e.seam ? 0.92 : 0.96;
      }
    }
    const n = edges.length, start = (Math.random() * n) | 0;
    for (let i = 0; i < n && cracks < 10; i++) {       // a few per frame, so a big break arrives as a run of crackles
      const e = edges[(start + i) % n];
      if (e.cracked || !e.shell) continue;
      const a = pts[e.a], b = pts[e.b];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      if (Math.abs(d - e.rest) / e.rest > e.thr) {
        e.cracked = true; e.born = performance.now(); cracks++; compsDirty = true;
        if (!cur.touched) { cur.touched = true; updateActions(); }   // once it has been squeezed it can no longer be sold
        for (const ti of e.t) {
          const t = tris[ti];
          if (!e.seam) t.sh = Math.random() * 2 - 1;        // a plate that splits inside breaks into smaller facets
        }
        for (const v of [e.a, e.b]) for (const ei of vEdges[v]) {   // a crack runs on along the seam it started in
          const o = edges[ei];
          if (!o.cracked) o.thr *= o.seam ? 0.55 : 0.9;
        }
        for (let k = 0; k < 2; k++) if (Math.random() < 0.6) dust.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, vx: (Math.random() - 0.5) * 2.6, vy: -Math.random() * 2, life: 1, s: 0.8 + Math.random() * 1.8 });
      }
    }
    // the last few crumbs let go on their own, so a toy can always be finished
    const crumble = shellCount > 0 && shellCount < tris.length * 0.08;
    if (crumble) for (const e of edges) if (e.shell && !e.cracked) { e.cracked = true; compsDirty = true; }
    if (compsDirty) findLoose();

    for (const piece of loose) {
      if (flakes >= 3) break;
      if (piece.gone) continue;
      let mx = 0, my = 0, maxDev = 0;
      for (const t of piece.tris) {
        const a = pts[t.a], b = pts[t.b], c = pts[t.c];
        maxDev = Math.max(maxDev, Math.abs(area(a, b, c) / t.rest - 1));
        mx += (a.x + b.x + c.x) / 3; my += (a.y + b.y + c.y) / 3;
      }
      mx /= piece.tris.length; my /= piece.tris.length;
      let near = null;
      for (const f of fs) if (Math.hypot(mx - f.x, my - f.y) < f.r * 1.8) near = f;
      if (maxDev > 0.3 || (near && Math.random() < 0.22) || (crumble && Math.random() < 0.25)) { detach(piece, mx, my, near); flakes++; }
    }
    if (cracks) { for (let i = 0; i < Math.min(cracks, 3); i++) crackle(0.5 + cracks / 10); buzz(6); }
    if (flakes) { for (let i = 0; i < Math.min(flakes, 2); i++) snap(); }
    if (shellCount === 0 && !doneFlag) {                   // squeezed clean: part of its shelf price, paid at once
      doneFlag = true; cleared++; S.made++; $('recoat').classList.add('ready');
      earn(Math.round(cur.price * 0.4), cx, cy - R * 0.4);
    }
  }

  // shell triangles still joined through uncracked edges form one piece; small pieces are free to come away
  function findLoose() {
    compsDirty = false; loose = [];
    for (const t of tris) t.seen = false;
    for (const t0 of tris) {
      if (!t0.shell || t0.seen) continue;
      const list = [t0]; t0.seen = true;
      for (let i = 0; i < list.length; i++) for (const ei of list[i].e) {
        const e = edges[ei];
        if (e.cracked) continue;
        for (const ti of e.t) { const o = tris[ti]; if (o.shell && !o.seen) { o.seen = true; list.push(o); } }
      }
      if (list.length <= 40) {
        // a piece that has cracked free all the way round tilts a little: it gets its own shade
        const tone = list[0].lt !== undefined ? list[0].lt : Math.random() * 2 - 1;
        for (const t of list) t.lt = tone;
        loose.push({ tris: list, gone: false });
      }
    }
  }

  function detach(piece, mx, my, near) {
    piece.gone = true;
    const verts = new Set();
    for (const t of piece.tris) { t.shell = false; verts.add(t.a); verts.add(t.b); verts.add(t.c); }
    for (const t of piece.tris) for (const ei of t.e) edges[ei].shell = edges[ei].t.some(ti => tris[ti].shell);
    for (const v of verts) pts[v].bare = vTris[v].every(ti => !tris[ti].shell);
    shellCount -= piece.tris.length; flakedTotal++;
    cur.pieces++;

    // the outer edge of the piece (edges that belong to only one of its triangles), for its lit rim
    const uses = new Map();
    for (const t of piece.tris) for (const ei of t.e) uses.set(ei, (uses.get(ei) || 0) + 1);
    const shape = (rx, ry) => {
      const poly = [], rim = [];
      for (const t of piece.tris) for (const v of [t.a, t.b, t.c]) poly.push(pts[v].x - rx, pts[v].y - ry);
      for (const [ei, n] of uses) if (n === 1) { const e = edges[ei]; rim.push(pts[e.a].x - rx, pts[e.a].y - ry, pts[e.b].x - rx, pts[e.b].y - ry); }
      return { p: poly, o: rim, tone: Math.random() * 2 - 1 };
    };

    if (piece.tris.length >= 3 && Math.random() < 0.6) {
      // most of the broken shell stays stuck to the filling and rides along on it
      let av = piece.tris[0].a, bd = Infinity;
      for (const v of verts) { const d = Math.hypot(pts[v].x - mx, pts[v].y - my); if (d < bd) { bd = d; av = v; } }
      stuck.push({ v: av, ...shape(pts[av].x, pts[av].y) });
    } else {
      const ox = near ? mx - near.x : mx - cx, oy = near ? my - near.y : my - cy, ol = Math.hypot(ox, oy) || 1;
      shards.push({
        x: mx, y: my, ...shape(mx, my),
        vx: ox / ol * (1.2 + Math.random() * 2.2), vy: oy / ol * (1.2 + Math.random() * 1.8) - 2.4,
        rot: 0, vr: (Math.random() - 0.5) * 0.3, life: 1,
      });
    }
    const now = performance.now();
    if (near && pressure > 0.08 && now - lastBurst > 450) { lastBurst = now; burst(mx, my); }   // one squirt per squeeze, not one per shard
  }

  // the shell was holding the filling in: where it opens under a squeeze, filling wells up and the runny centre squirts out
  function burst(x, y) {
    const s = pressure * (0.4 + 0.1 * P.ooze);
    pressure *= 0.8; burstTotal++;
    const dir = Math.atan2(y - cy, x - cx);
    const n = Math.round(2 + 4 * s);
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - 0.5) * 1.8, sp = 1.5 + Math.random() * 5 * s;
      goo.push({ x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, r: 6 + Math.random() * 10 * (0.5 + s) });
    }
    if (goo.length > 140) goo.splice(0, goo.length - 140);
    for (const t of tris) {
      if (t.shell) continue;
      const a = pts[t.a], b = pts[t.b], c = pts[t.c];
      if (Math.hypot((a.x + b.x + c.x) / 3 - x, (a.y + b.y + c.y) / 3 - y) < R * 0.4) t.rest = Math.min(t.rest0 * 2.2, t.rest * (1 + 0.3 * s));
    }
    for (let i = 0; i < 3; i++) {
      const v = nearestVertex(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30);
      blobs.push({ v, ox: (Math.random() - 0.5) * 8, oy: (Math.random() - 0.5) * 8, r: 9 + Math.random() * 12 * s });
    }
    if (blobs.length > 40) blobs.splice(0, blobs.length - 40);
    if (look.fizz) { fizzPop(x, y, s); hiss(); } else squelch(s);
    buzz(18);
    if (cur.tips > 0) { cur.tips--; earn(1, x, y); }       // a few tips for the show, capped per toy
  }

  // ---------- sound & haptics ----------
  let actx = null, noise = null, master = null;
  function initAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      noise = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function noiseBurst(freq, q, peak, len, rate, type) {
    if (!soundOn || !actx || actx.state !== 'running') return;
    const t = actx.currentTime + Math.random() * 0.035;
    const src = actx.createBufferSource(); src.buffer = noise; src.playbackRate.value = rate;
    const f = actx.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.15, len + 0.02);
  }
  const crackle = k => noiseBurst(2000 + Math.random() * 3800, 1.4, Math.min(0.5, 0.22 * k), 0.025 + Math.random() * 0.04, 0.8 + Math.random() * 1.2);
  const snap = () => noiseBurst(800 + Math.random() * 900, 2.2, 0.32, 0.06 + Math.random() * 0.04, 0.6 + Math.random() * 0.5);
  const squelch = s => { noiseBurst(380 + Math.random() * 160, 0.9, Math.min(0.6, 0.3 + 0.3 * s), 0.2, 0.3, 'lowpass'); noiseBurst(900, 1.2, 0.18, 0.09, 0.5); };
  const hiss = () => { noiseBurst(6200, 0.7, 0.3, 0.33, 1.5, 'highpass'); noiseBurst(3000, 1, 0.18, 0.25, 1); };
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {} }

  // ---------- drawing ----------
  function outline(c) {
    const n = boundary.length;
    const p = i => pts[boundary[(i + n) % n]];
    c.beginPath();
    c.moveTo((p(-1).x + p(0).x) / 2, (p(-1).y + p(0).y) / 2);
    for (let i = 0; i < n; i++) c.quadraticCurveTo(p(i).x, p(i).y, (p(i).x + p(i + 1).x) / 2, (p(i).y + p(i + 1).y) / 2);
    c.closePath();
  }
  function triPath(c, t) {
    const a = pts[t.a], b = pts[t.b], d = pts[t.c];
    c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(d.x, d.y); c.closePath();
  }
  function polyPath(c, p) {
    for (let i = 0; i < p.length; i += 6) { c.moveTo(p[i], p[i + 1]); c.lineTo(p[i + 2], p[i + 3]); c.lineTo(p[i + 4], p[i + 5]); c.closePath(); }
  }
  function gooPath(c, list) {
    c.beginPath();
    for (const g of list) {
      const stretch = 1 + Math.min(1.2, Math.abs(g.vy || 0) * 0.25);
      c.moveTo(g.x + g.r, g.y); c.ellipse(g.x, g.y, g.r, g.r * stretch, 0, 0, Math.PI * 2);
    }
  }
  // paint a list of pinned marks (dots, soft blushes, lines, filled shapes, lettering) at wherever the mesh has carried them
  function paint(c, list) {
    for (const d of list) {
      if (d.k === 'dot') {
        const q = at(d.an);
        c.beginPath(); c.ellipse(q.x, q.y, d.rx * unit, d.ry * unit, d.rot || 0, 0, Math.PI * 2);
        c.fillStyle = d.c; c.fill();
      } else if (d.k === 'soft') {
        const q = at(d.an), r = d.r * unit;
        const g = c.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
        g.addColorStop(0, `rgba(${d.c},${d.a})`); g.addColorStop(1, `rgba(${d.c},0)`);
        c.fillStyle = g; c.fillRect(q.x - r, q.y - r, r * 2, r * 2);
      } else if (d.k === 'text') {
        const q = at(d.an);
        c.font = `${Math.round(d.size * unit)}px "ZCOOL KuaiLe", "PingFang SC", sans-serif`;
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = d.c; c.fillText(d.text, q.x, q.y);
      } else {
        c.beginPath();
        d.ans.forEach((an, i) => { const q = at(an); if (i) c.lineTo(q.x, q.y); else c.moveTo(q.x, q.y); });
        if (d.k === 'poly') { c.closePath(); c.fillStyle = d.c; c.fill(); }
        else {
          if (d.close) c.closePath();
          c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = Math.max(1, d.w * unit); c.strokeStyle = d.c; c.stroke();
        }
      }
    }
  }
  function bubble(c, x, y, r, a) {
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
    c.fillStyle = `rgba(255,255,255,${0.16 * a})`; c.fill();
    c.lineWidth = 1; c.strokeStyle = `rgba(255,255,255,${0.85 * a})`; c.stroke();
    c.beginPath(); c.arc(x - r * 0.35, y - r * 0.35, Math.max(0.6, r * 0.22), 0, Math.PI * 2);
    c.fillStyle = `rgba(255,255,255,${0.9 * a})`; c.fill();
  }

  function draw() {
    const fl = look;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // contact shadow
    ctx.save();
    ctx.translate(cx, cy + R * 0.92); ctx.scale(1, 0.2);
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.2);
    sg.addColorStop(0, 'rgba(20,40,34,0.28)'); sg.addColorStop(1, 'rgba(20,40,34,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, R * 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // the filling: matte dough lit from the upper left, or a clear fizzy drink
    outline(ctx);
    const bg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.05, cx, cy, R * 1.5);
    const fa = fl.fizz ? 0.82 : 1;
    bg.addColorStop(0, hsl(fl.paste, fl.fizz ? 14 : 6, fa)); bg.addColorStop(0.55, hsl(fl.paste, 0, fa)); bg.addColorStop(1, hsl(fl.paste, -16, fa));
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = hsl(fl.paste, -22, 0.5); ctx.stroke();

    ctx.save(); outline(ctx); ctx.clip();
    if (!fl.fizz) {
      if (!pastePattern) pastePattern = ctx.createPattern(pasteTex, 'repeat');
      ctx.globalAlpha = 0.2; ctx.fillStyle = pastePattern; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
    paint(ctx, innerDecals);                           // whatever floats inside (lemon slices, popping pearls)
    for (const b of bubbles) bubble(ctx, b.x, b.y, b.r, 1);
    for (const d of dimples) {                         // thumbprints: shaded on the lit side, bright on the far rim
      const q = pts[d.v], x = q.x + d.ox, y = q.y + d.oy;
      let g = ctx.createRadialGradient(x - d.r * 0.2, y - d.r * 0.2, 0, x, y, d.r);
      g.addColorStop(0, hsl(fl.paste, -34, 0.3 * d.life)); g.addColorStop(1, hsl(fl.paste, -34, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
      g = ctx.createRadialGradient(x + d.r * 0.45, y + d.r * 0.45, 0, x + d.r * 0.45, y + d.r * 0.45, d.r * 0.6);
      g.addColorStop(0, `rgba(255,255,255,${0.3 * d.life})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + d.r * 0.45, y + d.r * 0.45, d.r * 0.6, 0, Math.PI * 2); ctx.fill();
    }
    if (blobs.length && !fl.fizz) {                    // runny centre showing in the wounds
      const list = blobs.map(b => ({ x: pts[b.v].x + b.ox, y: pts[b.v].y + b.oy, r: b.r }));
      gooPath(ctx, list); ctx.fillStyle = hsl(fl.goo); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      for (const g of list) if (g.r > 11) { ctx.beginPath(); ctx.ellipse(g.x - g.r * 0.3, g.y - g.r * 0.35, g.r * 0.28, g.r * 0.18, -0.6, 0, Math.PI * 2); ctx.fill(); }
    }
    // the shell sits proud of the filling: it throws a shadow onto it along every broken edge
    ctx.fillStyle = 'rgba(25,12,35,0.3)';
    if (shellCount) {
      ctx.save(); ctx.translate(2.5, 3.5); ctx.beginPath();
      for (const t of tris) if (t.shell) triPath(ctx, t);
      ctx.fill(); ctx.restore();
    }
    for (const s of stuck) {
      const q = pts[s.v];
      ctx.save(); ctx.translate(q.x + 2.5, q.y + 3.5); ctx.beginPath(); polyPath(ctx, s.p); ctx.fill(); ctx.restore();
    }
    ctx.restore();

    drawShell(fl);

    // broken shell still stuck to the filling
    ctx.globalAlpha = fl.shellAlpha;
    for (const s of stuck) {
      const q = pts[s.v];
      ctx.save(); ctx.translate(q.x, q.y); drawShard(fl, s); ctx.restore();
    }
    ctx.globalAlpha = 1;

    // depth under each finger
    ctx.save(); outline(ctx); ctx.clip();
    for (const f of fingers.values()) {
      if (f.r < 1) continue;
      const dg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.15);
      dg.addColorStop(0, 'rgba(30,20,40,0.32)'); dg.addColorStop(0.7, 'rgba(30,20,40,0.12)'); dg.addColorStop(1, 'rgba(30,20,40,0)');
      ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.15, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    for (const f of fingers.values()) {
      if (f.r < 1) continue;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
    }

    // squirted filling
    if (goo.length) {
      gooPath(ctx, goo); ctx.fillStyle = hsl(fl.goo, 0, fl.fizz ? 0.6 : 1); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (const g of goo) if (g.r > 8) { ctx.beginPath(); ctx.ellipse(g.x - g.r * 0.3, g.y - g.r * 0.35, g.r * 0.26, g.r * 0.17, -0.6, 0, Math.PI * 2); ctx.fill(); }
    }
    for (const b of pops) bubble(ctx, b.x, b.y, b.r, Math.min(1, b.life * 2));

    // falling shell
    for (const s of shards) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.6)) * fl.shellAlpha;
      drawShard(fl, s);
      ctx.restore();
    }
    ctx.fillStyle = hsl(fl.shell, 38);
    for (const d of dust) { ctx.globalAlpha = Math.max(0, d.life); ctx.beginPath(); ctx.arc(d.x, d.y, d.s, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;

    // sugar beans earned, drifting up
    ctx.font = '18px "ZCOOL KuaiLe", "PingFang SC", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,35,0,0.75)'; ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = '#ffd24a'; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // a loose piece of shell, drawn at the current origin: a darker side wall, the top face, and a lit rim
  function drawShard(fl, s) {
    const side = hsl(fl.shell, -18), face = hsl(fl.shell, s.tone * 5);
    ctx.lineJoin = 'round'; ctx.lineWidth = 0.8;
    ctx.save(); ctx.translate(1.4, 2.4); ctx.beginPath(); polyPath(ctx, s.p); ctx.fillStyle = side; ctx.strokeStyle = side; ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.beginPath(); polyPath(ctx, s.p); ctx.fillStyle = face; ctx.strokeStyle = face; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < s.o.length; i += 4) { ctx.moveTo(s.o[i], s.o[i + 1]); ctx.lineTo(s.o[i + 2], s.o[i + 3]); }
    ctx.lineCap = 'round'; ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
  }

  function drawShell(fl) {
    if (!shellCount) return;
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
    sctx.clearRect(0, 0, W, H);
    const shellCol = hsl(fl.shell);
    sctx.beginPath();
    for (const t of tris) if (t.shell) triPath(sctx, t);
    sctx.fillStyle = shellCol; sctx.fill();
    sctx.lineWidth = 0.7; sctx.strokeStyle = shellCol; sctx.lineJoin = 'round'; sctx.stroke();

    // whatever is painted on the shell: only ever drawn over shell that is still there
    sctx.globalCompositeOperation = 'source-atop';
    paint(sctx, decals);

    // broken pieces no longer lie flush: each one tilts its own way and takes the light differently
    const facets = [[], [], [], [], []];
    for (const t of tris) {
      if (!t.shell) continue;
      const s = t.lt !== undefined ? t.lt : (t.sh !== undefined ? t.sh * 0.6 : null);
      if (s !== null) facets[Math.max(0, Math.min(4, Math.round((s + 1) * 2)))].push(t);
    }
    ['rgba(0,0,0,0.22)', 'rgba(0,0,0,0.11)', null, 'rgba(255,255,255,0.11)', 'rgba(255,255,255,0.22)'].forEach((tone, i) => {
      if (!tone || !facets[i].length) return;
      sctx.beginPath(); facets[i].forEach(t => triPath(sctx, t)); sctx.fillStyle = tone; sctx.fill();
    });

    // a hard, glossy skin: dark towards the rim, a sharp key light, a small glint and a soft bounce light
    const rim = sctx.createRadialGradient(cx - R * 0.15, cy - R * 0.2, R * 0.3, cx, cy, R * 1.2);
    rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(1, `rgba(0,0,0,${0.42 - Math.max(0, fl.shell[2] - 60) * 0.0065})`);   // pale shells get a lighter edge so they stay white
    sctx.fillStyle = rim; sctx.fillRect(0, 0, W, H);
    const bounce = sctx.createRadialGradient(cx + R * 0.5, cy + R * 0.55, 0, cx + R * 0.5, cy + R * 0.55, R * 0.6);
    bounce.addColorStop(0, 'rgba(255,255,255,0.2)'); bounce.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = bounce; sctx.fillRect(0, 0, W, H);
    sctx.save();
    sctx.translate(cx - R * 0.36, cy - R * 0.46); sctx.rotate(-0.55); sctx.scale(1, 0.42);
    const hg = sctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.42);
    hg.addColorStop(0, 'rgba(255,255,255,0.95)'); hg.addColorStop(0.28, 'rgba(255,255,255,0.6)'); hg.addColorStop(0.55, 'rgba(255,255,255,0.12)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = hg; sctx.beginPath(); sctx.arc(0, 0, R * 0.42, 0, Math.PI * 2); sctx.fill();
    sctx.restore();
    const gl = sctx.createRadialGradient(cx - R * 0.14, cy - R * 0.64, 0, cx - R * 0.14, cy - R * 0.64, R * 0.07);
    gl.addColorStop(0, 'rgba(255,255,255,0.95)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = gl; sctx.fillRect(cx - R * 0.3, cy - R * 0.8, R * 0.32, R * 0.32);

    // cracks follow the edges that gave way. Bent wax goes white around a crack, and the crack itself
    // is a groove: shadowed on one lip, lit on the other, with the filling showing at the bottom
    const cracksPath = new Path2D(), freshPath = new Path2D(), nowT = performance.now();
    let anyFresh = false;
    for (const e of edges) {
      if (!e.cracked || e.t.length < 2) continue;
      if (!tris[e.t[0]].shell || !tris[e.t[1]].shell) continue;
      const a = pts[e.a], b = pts[e.b];
      cracksPath.moveTo(a.x, a.y); cracksPath.lineTo(b.x, b.y);
      if (nowT - e.born < 170) { freshPath.moveTo(a.x, a.y); freshPath.lineTo(b.x, b.y); anyFresh = true; }
    }
    const thick = 1 + (cur.layers - 1) * 0.35;         // a thicker shell shows wider grooves and a fatter lip
    sctx.lineCap = 'round'; sctx.lineJoin = 'round';
    sctx.lineWidth = 5 * thick; sctx.strokeStyle = 'rgba(255,255,255,0.1)'; sctx.stroke(cracksPath);
    sctx.save(); sctx.translate(0.7, 0.9); sctx.lineWidth = 1.5 * thick; sctx.strokeStyle = 'rgba(0,0,0,0.55)'; sctx.stroke(cracksPath); sctx.restore();
    sctx.lineWidth = 1.1 * thick; sctx.strokeStyle = hsl(fl.crack, 0, 0.9); sctx.stroke(cracksPath);
    sctx.save(); sctx.translate(-0.6, -0.7); sctx.lineWidth = 0.7; sctx.strokeStyle = 'rgba(255,255,255,0.5)'; sctx.stroke(cracksPath); sctx.restore();
    if (anyFresh) { sctx.lineWidth = 3.5; sctx.strokeStyle = 'rgba(255,255,255,0.8)'; sctx.stroke(freshPath); }   // a new crack flashes as it opens

    // where the shell has broken away you see its cut edge: a pale lip of wax
    sctx.beginPath();
    for (const e of edges) {
      if (e.t.length < 2) continue;
      if (tris[e.t[0]].shell === tris[e.t[1]].shell) continue;
      sctx.moveTo(pts[e.a].x, pts[e.a].y); sctx.lineTo(pts[e.b].x, pts[e.b].y);
    }
    sctx.lineWidth = 2.6 * thick; sctx.strokeStyle = hsl(fl.shell, 36, 0.9); sctx.stroke();
    sctx.globalCompositeOperation = 'source-over';

    ctx.globalAlpha = coat * fl.shellAlpha;
    ctx.drawImage(shellCv, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // ---------- loop ----------
  let last = 0, acc = 0, shownLeft = -1, shownFlakes = -1, shownBursts = -1, shownCleared = -1;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!W) return;
    acc += Math.min(60, now - (last || now)); last = now;
    let steps = 0;
    while (acc >= 16.6 && steps < 3) {
      physics(now); fracture();
      for (const s of shards) { s.vy += 0.35; s.x += s.vx; s.y += s.vy; s.rot += s.vr; s.life -= 0.02; }
      for (const d of dust) { d.vy += 0.12; d.x += d.vx; d.y += d.vy; d.life -= 0.04; }
      shards = shards.filter(s => s.life > 0 && s.y < H + 40);
      dust = dust.filter(d => d.life > 0);
      // bubbles in the drink rise, faster while it is being squeezed
      const rush = fingers.size ? 3 : 1;
      for (const b of bubbles) {
        b.y -= b.v * rush; b.x += Math.sin(now / 300 + b.r * 7) * 0.3;
        if (b.y < cy - R * 1.1) { b.y = cy + R * 1.05; b.x = cx + rnd(-R, R); }
      }
      for (const b of pops) { b.vy -= 0.04; b.x += b.vx + Math.sin(now / 120 + b.r) * 0.4; b.y += b.vy; b.vx *= 0.96; b.life -= 0.016; }
      pops = pops.filter(b => b.life > 0);
      for (const f of floats) { f.y -= 0.9; f.life -= 0.02; }
      floats = floats.filter(f => f.life > 0);
      if (coat < 1) coat = Math.min(1, coat + 0.035);
      acc -= 16.6; steps++;
    }
    draw();
    const left = Math.round(shellCount / tris.length * 100);
    if (left !== shownLeft) { shownLeft = left; $('left').textContent = left + '%'; $('bar').style.width = left + '%'; }
    if (flakedTotal !== shownFlakes) { shownFlakes = flakedTotal; $('flakes').textContent = flakedTotal; }
    if (burstTotal !== shownBursts) { shownBursts = burstTotal; $('bursts').textContent = burstTotal; }
    if (cleared !== shownCleared) { shownCleared = cleared; $('cleared').textContent = cleared; }
  }

  function resize() {
    const r = cv.getBoundingClientRect();
    if (!r.width || Math.abs(r.width - W) < 1) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = shellCv.width = Math.round(W * DPR);
    cv.height = shellCv.height = Math.round(H * DPR);
    build();
  }

  // a fizzy drink bursts into a spray of bubbles instead of a squelch of filling
  function fizzPop(x, y, s) {
    const n = Math.round(14 + 16 * s);
    for (let i = 0; i < n; i++) pops.push({ x: x + rnd(-14, 14), y: y + rnd(-10, 10), vx: rnd(-1.6, 1.6), vy: rnd(-3.2, -0.6), r: rnd(1.5, 6), life: rnd(0.6, 1.1) });
    if (pops.length > 160) pops.splice(0, pops.length - 160);
  }

  // ---------- the shop: beans, dipping, shelf, unlocks, daily stamp ----------
  function earn(n, x, y) {
    if (!n) return;
    S.coins += n; save();
    $('coins').textContent = S.coins;
    if (x !== undefined) floats.push({ x: x + rnd(-8, 8), y, text: '+' + n, life: 1 });
    renderCards();
  }

  function updateActions() {
    cur.price = priceOf(S.toy, S.coat, cur.layers);
    if (!cur.touched) cur.tips = Math.round(cur.price * 0.25);   // squeezing it yourself pays about two thirds of selling it
    const dip = $('dip'), sell = $('sell');
    dip.textContent = cur.layers >= 3 ? '已裹满 3 层' : `再裹一层（${cur.layers}/3）`;
    dip.disabled = cur.touched || cur.layers >= 3;
    const full = S.shelf.length >= SHELF_SLOTS;
    sell.textContent = cur.touched ? '捏过的卖不了' : (full ? '货架满了' : `上架卖 +${cur.price}`);
    sell.disabled = cur.touched || full;
    $('tag').innerHTML = `<b>${TOYS[S.toy].name}</b> · ${COATS[S.coat].name}脆皮 · ${cur.layers} 层`;
  }

  // start a fresh toy of the chosen food and coating on the workbench
  function make() { build(true); coat = 0; save(); renderCards(); }

  $('dip').addEventListener('click', () => {
    if (cur.touched || cur.layers >= 3) return;
    initAudio();
    cur.layers++;
    for (const e of edges) e.thr = edgeThr(e);
    for (const p of pts) { p.x = cx + (p.x - cx) * 0.96; p.y = cy + (p.y - cy) * 0.96; }   // the dip: a little wobble while the new layer sets
    coat = 0;
    updateActions();
  });
  $('sell').addEventListener('click', () => {
    if (cur.touched || S.shelf.length >= SHELF_SLOTS) return;
    S.shelf.push({ toy: S.toy, coat: S.coat, layers: cur.layers, price: cur.price, readyAt: Date.now() + sellMs(S.toy, cur.layers) });
    make(); renderShelf();
  });
  $('recoat').addEventListener('click', () => { initAudio(); make(); });

  function renderCards() {
    const fill = (box, keys, table, owned, active, pick) => {
      box.textContent = '';
      for (const key of keys) {
        const item = table[key], has = owned.includes(key);
        const b = document.createElement('button');
        b.type = 'button'; b.id = (table === TOYS ? 't-' : 'c-') + key;
        b.className = 'card' + (has ? '' : ' locked') + (key === active ? ' on' : '') + (!has && S.coins < item.price ? ' poor' : '');
        const sw = document.createElement('span'); sw.className = 'swatch';
        const a = item.shell ? hsl(item.shell) : 'var(--panel)', c = item.paste ? hsl(item.paste) : (item.shell ? hsl(item.shell, 12) : 'var(--line)');
        sw.style.background = `linear-gradient(135deg, ${a} 0 52%, ${c} 52% 100%)`;
        const name = document.createElement('span'); name.className = 'name'; name.textContent = item.name;
        const sub = document.createElement('span'); sub.className = 'sub';
        if (has) sub.textContent = key === active ? '使用中' : '已拥有';
        else { const bean = document.createElement('span'); bean.className = 'bean'; const cost = document.createElement('span'); cost.className = 'cost'; cost.textContent = item.price; sub.append(bean, cost); }
        b.append(sw, name, sub);
        b.addEventListener('click', () => {
          if (!has) {
            if (S.coins < item.price) { sub.textContent = `还差 ${item.price - S.coins}`; return; }
            S.coins -= item.price; owned.push(key); $('coins').textContent = S.coins;
          }
          pick(key); initAudio(); make();
        });
        box.appendChild(b);
      }
    };
    fill($('g-toys'), TOY_KEYS, TOYS, S.toys, S.toy, k => { S.toy = k; });
    fill($('g-coats'), COAT_KEYS, COATS, S.coats, S.coat, k => { S.coat = k; });
  }

  function renderShelf() {
    const box = $('g-shelf'), now = Date.now();
    box.textContent = '';
    let ready = 0;
    for (let i = 0; i < SHELF_SLOTS; i++) {
      const it = S.shelf[i], slot = document.createElement('div');
      slot.className = 'slot' + (it ? ' full' : '');
      if (!it) slot.textContent = '空位';
      else {
        const sw = document.createElement('span'); sw.className = 'swatch';
        const dipped = it.coat !== 'plain';
        sw.style.background = `linear-gradient(135deg, ${hsl(dipped ? COATS[it.coat].shell : TOYS[it.toy].shell)} 0 52%, ${hsl(TOYS[it.toy].paste)} 52% 100%)`;
        const name = document.createElement('span'); name.textContent = `${COATS[it.coat].name}${TOYS[it.toy].name} · ${it.layers} 层`;
        slot.append(sw, name);
        if (now >= it.readyAt) {
          ready++;
          const b = document.createElement('button'); b.type = 'button'; b.className = 'btn primary'; b.textContent = `收钱 +${it.price}`;
          b.addEventListener('click', () => { S.shelf.splice(S.shelf.indexOf(it), 1); earn(it.price); renderShelf(); updateActions(); });
          slot.appendChild(b);
        } else {
          const wait = document.createElement('span'); wait.textContent = `等客人 ${Math.ceil((it.readyAt - now) / 1000)} 秒`;
          slot.appendChild(wait);
        }
      }
      box.appendChild(slot);
    }
    $('pip-shelf').hidden = !ready;
  }

  const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function signState() {
    const today = dayKey(new Date()), y = new Date(); y.setDate(y.getDate() - 1);
    const done = S.sign.last === today;
    const alive = done || S.sign.last === dayKey(y);      // the streak survives only if yesterday was stamped
    const streak = alive ? S.sign.streak : 0;
    const got = streak % 7 === 0 && done && streak > 0 ? 7 : streak % 7;   // stamps collected in the current week
    return { today, done, streak, got };
  }
  function renderSign() {
    const st = signState(), box = $('g-days');
    box.textContent = '';
    SIGN.forEach((n, i) => {
      const d = document.createElement('div');
      d.className = 'day' + (i < st.got ? ' got' : '') + (!st.done && i === st.got % 7 ? ' next' : '');
      const label = document.createElement('span'); label.textContent = i < st.got ? '已领' : `第 ${i + 1} 天`;
      const amount = document.createElement('b'); amount.textContent = '+' + n;
      d.append(label, amount); box.appendChild(d);
    });
    const next = SIGN[st.got % 7];
    $('claim').disabled = st.done;
    $('claim').textContent = st.done ? '今天已领，明天再来' : `领取今天的 ${next} 糖豆`;
    $('pip-sign').hidden = st.done;
    $('signBtn').textContent = st.done ? '已签到' : '签到';
  }
  $('claim').addEventListener('click', () => {
    const st = signState();
    if (st.done) return;
    const reward = SIGN[st.got % 7];
    S.sign = { last: st.today, streak: st.streak + 1 };
    earn(reward); renderSign();
  });

  function showTab(name) {
    for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.tab === name));
    for (const n of ['toys', 'coats', 'shelf', 'sign']) $('p-' + n).hidden = n !== name;
    if (name === 'shelf') renderShelf();
    if (name === 'sign') renderSign();
  }
  for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => showTab(t.dataset.tab));
  $('signBtn').addEventListener('click', () => showTab('sign'));
  setInterval(renderShelf, 1000);

  $('reset').addEventListener('click', () => {
    try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
    S = fresh(); $('coins').textContent = S.coins;
    make(); renderShelf(); renderSign();
  });

  // ---------- input ----------
  function pos(ev) { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  cv.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    try { cv.setPointerCapture(ev.pointerId); } catch (_) {}
    initAudio();
    const p = pos(ev), now = performance.now();
    fingers.set(ev.pointerId, { x: p.x, y: p.y, t0: now, mark: now, r: 0 });
    if (!touched) { touched = true; $('hint').hidden = true; }
  });
  cv.addEventListener('pointermove', ev => {
    const f = fingers.get(ev.pointerId);
    if (f) { const p = pos(ev); f.x = p.x; f.y = p.y; }
  });
  const lift = ev => fingers.delete(ev.pointerId);
  cv.addEventListener('pointerup', lift);
  cv.addEventListener('pointercancel', lift);
  cv.addEventListener('lostpointercapture', lift);
  cv.addEventListener('contextmenu', ev => ev.preventDefault());

  for (const key of ['brittle', 'soft', 'rebound', 'ooze', 'finger']) {
    const el = $('k-' + key);
    const sync = () => { P[key] = +el.value; $('o-' + key).textContent = el.value; };
    el.addEventListener('input', () => {
      sync();
      if (key === 'brittle') { for (const e of edges) if (!e.cracked) e.thr = edgeThr(e); }
    });
    sync();
  }
  $('sound').addEventListener('change', ev => { soundOn = ev.target.checked; });
  soundOn = $('sound').checked;

  $('coins').textContent = S.coins;
  renderCards(); renderShelf(); renderSign();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
